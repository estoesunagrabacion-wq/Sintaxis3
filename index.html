<style>

  --hl:#ffe45c; --hl-ink:#2e2600;

    --hl:#7a6700; --hl-ink:#fff6c2;
    --ok:#7fe0aa; --ok-bg:#12382a; --bad:#ff9d94; --bad-bg:#44201a; --warn:#ffd27a; --warn-bg:#3d2d0a;
    --p0:#8db4ff; --p1:#ff9a85; --p2:#6fe0b8; --p3:#e2a2f2;
    --shadow:0 1px 0 rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1727; --grid:#1b2a44; --surface:#16213a; --surface2:#1d2b48; --ink:#e9eefb; --muted:#a3afc8; --line:#2f4066;
  --blue:#9db9ff; --margin:#a8493e; --link:#9db9ff; --u:#9db9ff; --u-ink:#0f1727;
  --u-rep:#9fb0d4; --u-coo:#f0b25a; --u-pia:#62d2a8; --u-pis:#86aaff; --u-pro:#d9a0ea; --u-adv:#ff8f84;
  --hl:#7a6700; --hl-ink:#fff6c2;
  --ok:#7fe0aa; --ok-bg:#12382a; --bad:#ff9d94; --bad-bg:#44201a; --warn:#ffd27a; --warn-bg:#3d2d0a;
  --p0:#8db4ff; --p1:#ff9a85; --p2:#6fe0b8; --p3:#e2a2f2;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6); color-scheme:dark;
}
#app[data-u="rep"]{--u:var(--u-rep)} #app[data-u="coo"]{--u:var(--u-coo)} #app[data-u="pia"]{--u:var(--u-pia)}
#app[data-u="pis"]{--u:var(--u-pis)} #app[data-u="pro"]{--u:var(--u-pro)} #app[data-u="adv"]{--u:var(--u-adv)}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;background-attachment:fixed;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3,h4{font-family:Literata,Georgia,"Times New Roman",serif;line-height:1.2;text-wrap:balance;margin:0;font-weight:600}
.mono{font-weight:700;letter-spacing:.02em}
.pen{font-family:Caveat,"Segoe Print","Bradley Hand",cursive;font-weight:700}
a,.linkbtn{color:var(--link)}

/* cabecera: lomo y pestañas de cuaderno */
.bar{padding-block:10px 2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:6px 16px 0;background:var(--bg);border-bottom:2px solid var(--u)}
.bar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:nowrap}
.brand{font-family:Literata,Georgia,serif;font-weight:700;font-size:1.2rem;display:flex;align-items:baseline;gap:8px;letter-spacing:-.01em}
.brand small{font-family:Caveat,cursive;font-weight:700;color:var(--margin);font-size:1.25rem}
.tools{display:flex;gap:4px}
.tbtn{border:0;background:none;border-radius:6px;padding:4px 8px;font-size:.84rem;min-height:34px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:2px}
.tbtn:hover{text-decoration-color:var(--u)}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{--tc:var(--blue);flex:0 0 auto;background:var(--surface2);border:1px solid var(--line);border-top:5px solid var(--tc);border-bottom:0;border-radius:8px 8px 0 0;padding:3px 11px 4px;color:var(--muted);font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;min-height:42px;position:relative;top:2px}
.tab[data-tab="rep"]{--tc:var(--u-rep)}.tab[data-tab="coo"]{--tc:var(--u-coo)}.tab[data-tab="pia"]{--tc:var(--u-pia)}.tab[data-tab="pis"]{--tc:var(--u-pis)}.tab[data-tab="pro"]{--tc:var(--u-pro)}.tab[data-tab="adv"]{--tc:var(--u-adv)}
.tab span.n{font-weight:400;font-size:.72rem;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);top:2px;padding-bottom:6px;border-color:var(--tc);border-top-width:7px;box-shadow:0 2px 0 var(--bg)}
.crumbs{font-size:.8rem;color:var(--muted);padding:6px 0 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs b{color:var(--ink)}
.crumbs .sep{opacity:.5}

main{padding-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
/* hoja con margen rojo */
.card.sheetp,.card.teo,[data-ex]{padding-left:30px;background-image:linear-gradient(90deg,transparent 15px,var(--margin) 15px,var(--margin) 16.5px,transparent 16.5px,transparent 19px,var(--margin) 19px,var(--margin) 20.5px,transparent 20.5px);}
h2{font-size:1.55rem;letter-spacing:-.01em}
h3{font-size:1.2rem}
h4{font-size:1.05rem;margin:20px 0 6px}
.muted{color:var(--muted)}
.sub{display:flex;gap:6px;margin:12px 0 14px}
.seg{border:1.5px solid var(--ink);background:var(--surface);padding:6px 16px;border-radius:6px;font-weight:700;min-height:42px}
.seg[aria-pressed="true"]{background:var(--u);color:var(--u-ink);border-color:var(--u)}

/* teoría */
.teo p,.teo li{max-width:66ch}
.teo .lead{font-family:Literata,Georgia,serif;font-size:1.1rem}
.teo .ex{font-family:Literata,Georgia,serif;background:linear-gradient(transparent 0,transparent 100%);padding:6px 12px;border-left:4px solid var(--u);background:var(--surface2)}
.teo ul{padding-left:1.2em}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;min-width:100%;font-size:.92rem}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--surface2)}
s{color:var(--bad);text-decoration-thickness:2px}

/* inicio */
.hero h2{font-size:2.2rem;line-height:1.05;margin-bottom:10px;letter-spacing:-.02em}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 14px 30px;box-shadow:var(--shadow);margin:14px 0;background-image:linear-gradient(90deg,transparent 15px,var(--margin) 15px,var(--margin) 16.5px,transparent 16.5px,transparent 19px,var(--margin) 19px,var(--margin) 20.5px,transparent 20.5px)}
.demo .s{font-family:Literata,Georgia,serif;font-size:1.35rem;line-height:2.1}
.demo .pia{text-decoration:underline wavy var(--p1);text-underline-offset:7px;text-decoration-thickness:2px}
.demo .nx{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.demo .note{font-size:1.3rem;color:var(--p1);line-height:1.15;margin:4px 0 0;transform:rotate(-1deg)}
.demo .note+.note{color:var(--p0)}
.indice{margin:6px 0 0;padding:0;list-style:none}
.indice li+li{border-top:1px dashed var(--line)}
.irow{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 4px 10px 14px;position:relative;border-left:6px solid var(--tc)}
.irow:hover{background:var(--surface2)}
.irow .l1{display:flex;align-items:baseline;gap:8px}
.irow .nm{font-family:Literata,Georgia,serif;font-weight:600;font-size:1.15rem}
.irow .dots2{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px)}
.irow .cnt{font-variant-numeric:tabular-nums;font-weight:700}
.irow p{margin:2px 0 6px;font-size:.9rem;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tc);width:0}
.callout{border-radius:6px;padding:10px 12px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--hl);font-size:.92rem}

/* lista de práctica */
.grp{margin-top:18px}
.grp h4{margin:0 0 8px;font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;min-height:44px;padding:6px 10px;border-radius:4px;border:1.5px solid var(--ink);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem;position:relative}
.chip.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.star::after{content:"★";position:absolute;top:-9px;right:-5px;font-size:.9rem;color:var(--margin)}
.chip.cur{outline:3px solid var(--hl);outline-offset:1px}
.btn{border:1.5px solid var(--u);background:var(--u);color:var(--u-ink);border-radius:6px;padding:9px 16px;font-weight:700;min-height:44px}
.btn.alt{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ejercicio */
.exhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.exhead h3{font-family:Caveat,cursive;font-size:1.9rem;color:var(--margin);font-weight:700}
.sent{font-family:Literata,Georgia,serif;font-size:1.28rem;line-height:2.4;margin:10px 0 6px;overflow-wrap:anywhere}
.w{border-radius:3px;padding:2px 0;transition:background .12s}
.tap .w{cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:6px}
.tap .w:hover,.tap .w:focus-visible{background:var(--surface2)}
.w.sel{background:var(--hl);color:var(--hl-ink)}
.w.pron{background:linear-gradient(transparent 20%,var(--hl) 20%);color:var(--hl-ink);padding:2px 3px;font-weight:600}
.w.nx{background:linear-gradient(transparent 20%,var(--hl) 20%);color:var(--hl-ink);font-weight:700}
.w.nxok{box-shadow:inset 0 -3px 0 var(--ink);font-weight:700}
.w.ante{box-shadow:inset 0 -3px 0 var(--ok)}
.sp.in,.w.in{background:color-mix(in srgb,var(--pc,var(--p0)) 13%,transparent)}
.br{font-family:Caveat,cursive;font-weight:700;color:var(--pc,var(--p0));font-size:1.7em;line-height:0;padding-inline:1px;vertical-align:-.08em}
.br sub{font-size:.5em;margin-left:1px;font-family:Atkinson Hyperlegible,sans-serif}
.help{margin:6px 0 0;color:var(--muted);font-size:.93rem}
.marks{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.mk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--pc,var(--line));border-radius:4px;padding:3px 4px 3px 10px;font-size:.88rem;background:var(--surface);max-width:100%}
.mk.ok{background:var(--ok-bg);border-color:var(--ok)}
.mk em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.mk button{border:0;background:var(--surface2);border-radius:50%;width:26px;height:26px;line-height:1;padding:0}
.fb{border-radius:4px;padding:8px 12px;margin-top:10px;border:1px solid var(--line);border-left-width:5px;font-size:.97rem}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb.info{background:var(--warn-bg);border-color:var(--margin)}
.fb b.t{display:block;margin-bottom:0;font-family:Caveat,cursive;font-size:1.45rem;line-height:1.1;color:var(--bad)}
.fb.ok b.t{color:var(--ok)}
.fb.info b.t{color:var(--margin)}
.q{font-family:Literata,Georgia,serif;font-size:1.1rem;margin:14px 0 8px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px}
.opts.col1{grid-template-columns:1fr}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;min-height:46px;line-height:1.3;box-shadow:2px 2px 0 var(--line)}

.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink);box-shadow:none;text-decoration:line-through;text-decoration-color:var(--bad)}

.pcards{display:flex;flex-direction:column;gap:8px;margin-top:12px}

.pc .sum{margin:4px 0 0;font-size:.92rem}

.dots{display:flex;gap:4px;margin:4px 0}
.dots i{width:18px;height:5px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--u)}
.res{text-align:center;padding:10px 4px}
.res .big{font-size:3rem;color:var(--margin);font-family:Caveat,cursive;line-height:1}
.res h3{font-family:Caveat,cursive;font-size:2rem;color:var(--ok)}

/* ventana auxiliar */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,16,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:88vh;overflow:auto;border-radius:12px 12px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--u)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--bg);padding:8px 0;z-index:2}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
textarea.cp{width:100%;min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}

/* árbol */
.tree{display:grid;gap:8px}
.tn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 10px;font-size:.92rem}

@media (min-width:700px){ .sent{font-size:1.5rem} .hero h2{font-size:2.8rem} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
.w.wrong{background:var(--bad-bg);text-decoration:line-through;text-decoration-color:var(--bad)}
.w.ok{background:var(--ok-bg);box-shadow:inset 0 -3px 0 var(--ok)}

/* reorganización v4 */
.uh{font-size:1.4rem}
.uc{margin:2px 0 0;font-size:.9rem}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:12px 0 14px}
.seg{border-radius:0;padding:6px 8px;text-align:center}
.seg:first-child{border-radius:6px 0 0 6px}.seg:last-child{border-radius:0 6px 6px 0;margin-left:-1.5px}
.ctx{font-size:.82rem;color:var(--muted);margin-top:-2px}
.acts{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;align-items:stretch}
.acts .btn{padding-inline:10px;line-height:1.2}
.acts .muted{grid-column:1/-1}
details.grp{margin-top:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸";color:var(--u);margin-right:6px;transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
.grp .gt{flex:1}
.grp .gc{font-family:Atkinson Hyperlegible,sans-serif;font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);font-weight:700}

  .hero h2{font-size:1.8rem}

}

</style>

<script>
const TEORIA = {
rep: `
<p class="lead">Un predicado verbal tiene un verbo como núcleo, que puede estar acompañado por distintos <b>modificadores del verbo</b>. Antes de analizar proposiciones conviene tenerlos a mano.</p>
<h4>Objeto directo (OD)</h4>
<p>Es el objeto de la acción. Se puede reemplazar por <b>lo, la, los, las</b> y, al pasar la oración a voz pasiva, se convierte en sujeto. Aparece con «a» cuando es una persona.</p>
<p class="ex">Compré un lápiz → <i>Lo</i> compré. · Visité <u>a María</u> → <i>La</i> visité.</p>
<h4>Objeto indirecto (OI)</h4>
<p>Indica a quién va dirigida la acción. Se reemplaza por <b>le, les</b> y va con «a» o «para». El pronombre puede <em>duplicar</em> al OI sin que haya dos.</p>
<p class="ex">Le pegué una trompada <u>a Pedro</u>. (<i>le</i> y <i>a Pedro</i> son el mismo OI)</p>
<h4>Predicativo subjetivo</h4>
<p>Modifica al verbo y también al sujeto: coincide con él en género y número. Es <b>obligatorio (PSO)</b> con los verbos copulativos (<i>ser, estar, parecer</i>) y <b>no obligatorio (PSNO)</b> con los demás.</p>
<p class="ex">La prueba era <u>dificilísima</u> (PSO). · El chico caminaba <u>veloz</u> entre la gente (PSNO).</p>
<h4>Complemento agente (CAg)</h4>

<h4>Circunstanciales</h4>
<p>Expresan una circunstancia de la acción. Con preposición son <em>complementos circunstanciales</em>; sin ella (un adverbio), <em>circunstanciales</em>.</p>
<div class="tbl"><table><tr><th>Tipo</th><th>Pregunta</th></tr>

coo: `
<p class="lead">Una <b>proposición</b> es la expresión de una idea completa, pero a diferencia de la oración <em>no tiene autonomía sintáctica</em>: forma parte de una estructura mayor.</p>
<p><b>Proposiciones coordinadas</b> son las que están en el mismo nivel sintáctico y forman una oración compuesta. Cada una se analiza por dentro como una oración simple.</p>
<p class="ex">[(Juan corre), (Elena lee) y (María escribe).]</p>
<div class="tbl"><table>
<tr><th>Clase</th><th>Nexos</th><th>Significado</th></tr>
<tr><td>Copulativa</td><td>y, e, ni</td><td>Suma: lo dicho en una se suma a la otra.</td></tr>
<tr><td>Disyuntiva</td><td>o, u</td><td>Exclusión: si se da una, no se da la otra.</td></tr>
<tr><td>Adversativa</td><td>pero, mas, sino, sin embargo, no obstante</td><td>Oposición total o parcial.</td></tr>
<tr><td>Explicativa</td><td>es decir, esto es, o sea</td><td>Una proposición explica el sentido de la otra.</td></tr>
<tr><td>Yuxtapuesta</td><td>coma, punto y coma, dos puntos</td><td>Una junto a otra, sin nexo.</td></tr></table></div>
<h4>Cómo se analiza</h4>
<p>Se marcan las proposiciones y cada una se analiza como una oración. Ojo: un <em>sujeto compuesto</em> («él y su novia») no es coordinación de proposiciones.</p>
<h4>Ojo: predicado compuesto no es coordinación</h4>
<p>Para que haya <b>dos proposiciones coordinadas</b> tiene que haber <b>dos verbos con sujetos distintos</b>. Si los dos verbos comparten el mismo sujeto, es una <b>oración simple bimembre con predicado compuesto</b>.</p>
<p class="ex"><b>Juan corre y Elena lee.</b> → oración compuesta por coordinación (dos sujetos: <i>Juan</i>, <i>Elena</i>).</p>
<p class="ex"><b>Juan compró un libro y luego lo leyó en el bar.</b> → oración simple bimembre con predicado compuesto (un solo sujeto, <i>Juan</i>, para «compró» y «leyó»).</p>
<p>Truco: preguntate «¿quién hace cada verbo?». Si es la misma persona o cosa, no se corta la oración en dos.</p>

<p class="lead">Las <b>proposiciones incluidas</b> (antes «subordinadas») están dentro de una oración y tienen <b>dos niveles de análisis</b>: cumplen una función dentro de la oración que las incluye y, además, se analizan por dentro como una oración simple.</p>
<p>Las <b>adjetivas</b> cumplen las funciones del adjetivo: modificador directo de un sustantivo, predicativo y predicado no verbal. Están encabezadas por un <b>nexo relacionante</b> que toma el significado del sustantivo al que modifica: el <b>antecedente</b>.</p>
<p class="ex">La chica (<b>que</b> pasó recién) es mi hermana. → <i>la chica</i> pasó recién (que = sujeto)</p>
<h4>Nexos relacionantes</h4>
<ul>
<li><b>Relacionante:</b> marca la subordinación <em>y además</em> cumple una función dentro de la proposición. Tiene antecedente.</li>
<li><b>Subordinante:</b> sólo marca la subordinación. No tiene antecedente y se tacha al bajar la proposición. Las adjetivas llevan siempre relacionantes.</li>
</ul>
<div class="tbl"><table>
<tr><th>Relacionante</th><th>Función dentro de la proposición</th></tr>
<tr><td>que, quien/es, el cual…</td><td>funciones del sustantivo: sujeto, OD, OI, término</td></tr>
<tr><td>cuyo/a/os/as</td><td>modificador directo de un sustantivo (concuerda con él)</td></tr>
<tr><td>donde, cuando, como</td><td>circunstanciales de lugar, tiempo y modo</td></tr></table></div>
<p class="ex">Fue a la casa de sus abuelos (<b>a quienes</b> él quería mucho).<br>El cuento, (<b>cuya</b> difusión es amplia), es un género difundido.<br>Nos encontramos en el lugar (<b>donde</b> nos conocimos).</p>
<h4>Especificativas y explicativas</h4>
<p>La <b>especificativa</b> selecciona una parte del antecedente (lo recorta frente a otros). La <b>explicativa</b> sólo agrega un rasgo: va entre pausas (comas) y se puede quitar sin cambiar el sentido.</p>
<p class="ex">Los alumnos que estudiaron aprobaron. (sólo algunos)<br>Los alumnos, que estudiaron, aprobaron. (todos)</p>
<h4>Errores frecuentes</h4>
<ul>
<li>El relacionante tiene que cumplir una función: «<s>una película que su protagonista es…</s>» → <i>cuyo protagonista es…</i></li>
<li>No se duplica la función: «<s>donde que se reparten</s>». Si falta un circunstancial de lugar, usá <i>en el cual</i> o <i>donde</i>.</li>
</ul>

<p class="lead">Las <b>incluidas sustantivas</b> cumplen dentro de la oración las funciones del sustantivo: sujeto, objeto directo, aposición, predicativo (PSO) y término. <em>No tienen antecedente.</em></p>
<p class="ex">El que cruzó los Andes liberó América. (sujeto) · Estudiamos al que cruzó los Andes. (término del OD) · La espada del que cruzó los Andes… (término)</p>
<div class="tbl"><table>
<tr><th colspan="2">Con nexo</th><th colspan="2">Sin nexo</th></tr>
<tr><th>Subordinante</th><th>Relacionante</th><th>Discurso directo</th><th>Interrogativa o exclamativa indirecta</th></tr>
<tr><td><b>que, si</b>. Sólo marcan la subordinación; se tachan al bajar.</td><td><b>el que, la que, los/las que, lo que, quien/es, cuanto, donde, cuando</b>. Marcan la subordinación y cumplen una función.</td><td>Entre comillas, después de un verbo de decir o pensar.</td><td>Encabezadas por pronombres con tilde: <b>qué, cuál, quién, cuándo, cuánto, dónde, cómo</b>.</td></tr></table></div>
<h4>Cómo reconocer una PIS</h4>
<p>Se puede reemplazar por <b>esto</b> o <b>eso</b> (o por <i>lo</i> si es OD): <i>Me dijo <u>que no vengas más</u> → Me dijo <u>esto</u></i>.</p>
<p class="ex">Me dijo (<b>que</b> no venga más). — Me preguntó (<b>si</b> me sentía bien). — Me dijo: (“Llegaste tarde”). — Me preguntó (<b>qué</b> hora era).</p>
<h4>Queísmo y dequeísmo</h4>
<p><b>Dequeísmo:</b> poner «de» donde no corresponde («<s>pienso de que</s>»). <b>Queísmo:</b> omitirlo donde hace falta («<s>me di cuenta que</s>»). Para comprobarlo, reemplazá la PIS por <i>eso</i>: «pienso eso», pero «me di cuenta de eso».</p>
<p>También: <s>a menos de que</s> → a menos que · <s>una vez de que</s> → una vez que · <s>a medida de que</s> → a medida que.</p>

pro: `
<p class="lead">Los pronombres personales <b>cambian de forma según la función</b> que cumplen (declinación por caso): <i>yo</i> (sujeto), <i>me</i> (OD, OI, SCR), <i>mí</i> (término). Acá interesan los de caso objetivo: me, te, se, lo, la, le, nos…</p>
<ul>
<li><b>le, les</b> son siempre objeto indirecto (a veces duplicándolo).</li>
<li><b>lo, la, los, las</b> son siempre objeto directo.</li>
<li>Con los demás hay que hacer el recorrido del árbol de abajo.</li>
</ul>
<p>Si hay <i>lo</i> y <i>le</i> juntos, «le» se reemplaza por <b>se</b> («<s>le lo</s>» suena mal): <i>Juan <b>se</b> la prestó</i>. Ese «se» sigue siendo OI.</p>
<h4>Árbol de decisión</h4>
<div id="tree-slot"></div>
<h4>Resumen de funciones</h4>
<div class="tbl"><table>
<tr><th>Tipo</th><th>Ejemplo</th><th>Función</th></tr>
<tr><td>No coincide con el sujeto</td><td>Te vi. · Me trajo.</td><td>OD u OI</td></tr>
<tr><td>Reflejo puro</td><td>Juan <b>se</b> peina (a sí mismo).</td><td>OD u OI</td></tr>
<tr><td>Recíproco (plural)</td><td>Ellos <b>se</b> saludaron (entre ellos).</td><td>OD u OI</td></tr>
<tr><td>Cuasirreflejo</td><td>Juan <b>se</b> cayó. · <b>Nos</b> vamos.</td><td>SCR</td></tr>
<tr><td>Pasiva con se</td><td><b>Se</b> abrieron las puertas.</td><td>marca de pasiva</td></tr>
<tr><td>Se impersonal</td><td>Aquí <b>se</b> vacuna. · <b>Se</b> come pescado.</td><td>marca de impersonalidad</td></tr></table></div>
<p>La <b>pasiva con se</b> no admite complemento agente («<s>se abrió una puerta por Juan</s>»). Con el <b>se impersonal</b> el verbo no varía con el número de lo que sigue, que es OD: <i>se come pescado / se come pastas</i>.</p>

<p class="lead">Las <b>incluidas adverbiales</b> cumplen la función del adverbio. Se dividen en las que tienen <b>función circunstancial</b> y las que no.</p>
<h4>A. Con función circunstancial</h4>
<p>Se pueden reemplazar por un adverbio (<i>allí, entonces, así, mucho</i>), salvo las causales, que no tienen adverbio equivalente.</p>
<div class="tbl"><table>
<tr><th>Clase</th><th>Función</th><th>Nexos</th><th>Tipo de nexo</th></tr>
<tr><td>Locativas</td><td>C. de lugar</td><td>donde, adonde</td><td>relacionante</td></tr>
<tr><td>Temporales</td><td>C. de tiempo</td><td>cuando, mientras, en tanto (simultaneidad) · antes que, no bien, apenas (anterioridad) · después que, luego de que (posterioridad)</td><td>relacionante</td></tr>
<tr><td>Modales</td><td>C. de modo</td><td>como, según, como si</td><td>relacionante</td></tr>
<tr><td>Cuantitativas</td><td>C. de cantidad</td><td>cuanto</td><td>relacionante</td></tr>
<tr><td>Causales</td><td>C. de causa</td><td>porque, pues, puesto que, ya que</td><td>subordinante</td></tr></table></div>
<p class="ex">Llevó al niño (<b>donde</b> están sus padres). — El viento entraba (<b>mientras</b> mi madre bordaba). — Lo miró (<b>como</b> tenía costumbre). — Dije esas pavadas (<b>porque</b> había tomado alcohol).</p>
<h4>B. Sin función circunstancial</h4>
<p>No modifican al verbo: modifican al resto de la oración (el <b>núcleo oracional</b>) o a otro adverbio o adjetivo.</p>
<div class="tbl"><table>
<tr><th>Clase</th><th>Función</th><th>Nexos (subordinantes)</th></tr>
<tr><td>Consecutivas</td><td>Complemento consecutivo</td><td><b>que</b>, correlativo de <i>tan, tanto</i></td></tr>
<tr><td>Concesivas</td><td>M.N.O.</td><td>aunque, si bien, por más que, aun cuando, así (+ subjuntivo)</td></tr>
<tr><td>Condicionales</td><td>M.N.O.</td><td>si, con tal que, siempre que, como (+ subjuntivo)</td></tr></table></div>
<p class="ex">Trabaja tanto (<b>que</b> apenas lo vemos). — (<b>Aunque</b> me lo pidan), no cederé. — (<b>Si</b> estudiaras más), aprobarías.</p>
<p>La <b>concesiva</b> expresa una objeción que no impide lo que dice el núcleo oracional; la <b>condicional</b>, una hipótesis o condición para que se cumpla.</p>
<h4>Correlaciones verbales en la condición</h4>
<div class="tbl"><table>
<tr><th>Condición</th><th>Subordinada (si…)</th><th>Núcleo oracional</th><th>Ejemplo</th></tr>
<tr><td>Real</td><td>indicativo (casi todos los tiempos)</td><td>indicativo o imperativo</td><td>Si tengo plata, me compro una computadora.</td></tr>
<tr><td>Posible</td><td>pretérito imperfecto del subjuntivo</td><td>condicional simple</td><td>Si tuviera plata, me compraría una computadora.</td></tr>
<tr><td>Imposible</td><td>pretérito pluscuamperfecto del subjuntivo</td><td>condicional compuesto o pluscuamperfecto del subjuntivo</td><td>Si hubiera tenido plata, me habría comprado una computadora.</td></tr></table></div>
<p>Es incorrecto usar el condicional dentro de la proposición con «si»: «<s>si tendría plata</s>», «<s>si habría tenido</s>».</p>
<h4>No confundir</h4>
<p><i>el lugar <b>donde</b> vendían</i> (adjetiva: tiene antecedente) · <i>llegamos <b>adonde</b> vendían</i> (adverbial locativa) · <i>preguntamos <b>dónde</b> vendían</i> (sustantiva interrogativa indirecta: «dónde» lleva tilde).</p>

/* ---------- utilidades DOM ---------- */
function h(tag,props){
  const el=document.createElement(tag);
  props=props||{};
  for(const k in props){
    const v=props[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el[k]=v;
    else if(k==='style') el.setAttribute('style',v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(let i=2;i<arguments.length;i++) add(el,arguments[i]);
  return el;
}
function add(el,c){ if(c==null||c===false) return; if(Array.isArray(c)) c.forEach(x=>add(el,x)); else el.append(c.nodeType?c:document.createTextNode(c)); }
function q(s,el){return (el||document).querySelector(s);}
function txt(it,s,e){let r='';for(let i=s;i<=e;i++){const t=it.k[i];if(i>s&&t.s)r+=' ';r+=t.t;}return r;}
function hash(s){let x=0;for(let i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))|0;return Math.abs(x);}
function seeded(arr,seed){const a=arr.slice();let s=seed||1;for(let i=a.length-1;i>0;i--){s=(s*1103515245+12345)&0x7fffffff;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const alts=v=>String(v).split('/');
const fnName=c=>FN[alts(c)[0]]||c;

    spans.filter(sp=>sp.s===i).sort((a,b)=>b.e-a.e).forEach(sp=>el.append(h('span',{class:'br',style:'--pc:'+PI_COLORS[sp.c%4],'aria-hidden':'true'},sp.g==='c'?'[':'(',h('sub',{},sp.n))));
    const w=h('span',{class:'w '+((cls&&cls(i))||[]).join(' '),'data-i':i},t.t);
    if(onTap&&t.w){w.tabIndex=0;w.setAttribute('role','button');w.onclick=()=>onTap(i);w.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();onTap(i);}};}

}

function onTapMark(i){

function checkMarks(){
  const it=R.it;R.checks++;

  R.marks.forEach(m=>{const k=keys.find(p=>p.s===m.s&&p.e===m.e);if(k)m.ok=true;else bad.push(m);});
  const matched=keys.filter(p=>R.marks.some(m=>m.ok&&m.s===p.s&&m.e===p.e));
  const missing=keys.length-matched.length;
  if(!bad.length&&!missing){
    // ordenar marcas por posición para numerar
    R.marks.sort((a,b)=>a.s-b.s||b.e-a.e);
    R.stage='props';R.pi=0;R.msg=null;R.ps=keys.map(()=>null);activate(0);rerender();return;
  }

    const near=keys.filter(p=>!(p.e<m.s||p.s>m.e)).sort((a,b)=>Math.abs(a.s-m.s)+Math.abs(a.e-m.e)-Math.abs(b.s-m.s)-Math.abs(b.e-m.e))[0];
    let t='«'+txt(it,m.s,m.e)+'» no coincide con ninguna proposición.';

  rerender();

/* --- preguntas por proposición --- */
function buildSteps(p){
  const n=p.nexo,S=[{k:'type'}];
  if(p.t==='coord'){ if(n)S.push({k:'nexo'},{k:'ctype'}); else if(p.ct==='yux')S.push({k:'ctype'}); }
  else if(p.t==='PIA')S.push({k:'nexo'},{k:'nclass'},{k:'ante'},{k:'nfunc'},{k:'esp'});
  else if(p.t==='PIS'){S.push({k:'pcls'}); if(p.sub!=='dd'){S.push({k:'nexo'}); if(n.c!=='sub')S.push({k:'nfunc'});} S.push({k:'pfunc'});}
  else if(p.t==='PIAdv'){S.push({k:'adv'},{k:'nexo'},{k:'nclass'}); if(n.c==='rel')S.push({k:'nfunc'}); S.push({k:'pfunc'});}
  return S;
}
function activate(i){
  R.pi=i;const p=R.it.props[i];
  if(!R.ps[i])R.ps[i]={steps:buildSteps(p),si:0,w:{},sum:[],done:false,reveal:false,sel:[],msg:null,typed:false};
}
function pstate(i){return R.ps[i];}
function keyFor(k,p){
  switch(k){
    case 'type':return p.t;
    case 'ctype':return p.nexo?p.nexo.ct:'yux';
    case 'nclass':return p.nexo.c;
    case 'nfunc':return p.nexo.nf;
    case 'esp':return p.sub;
    case 'pcls':return p.sub==='dd'?'dd':p.nexo.c;
    case 'adv':return p.sub;
    case 'pfunc':return p.t==='PIAdv'?ADV_FN[p.sub]:p.f;
  }
}
function nexoText(it,p){return txt(it,p.nexo.s,p.nexo.e);}
function labelOf(k,p,v){
  switch(k){
    case 'type':return TYPES.find(o=>o.v===v).t;
    case 'ctype':return CT.find(o=>o.v===v).t;
    case 'nclass':return NCLASS.find(o=>o.v===v).t;
    case 'pcls':return PCLS.find(o=>o.v===v).t;
    case 'adv':return ADV.find(o=>o.v===v).t;
    case 'esp':return v==='esp'?'Especificativa':'Explicativa';
    default:return fnName(v);
  }
}
function sumLine(k,p){
  const it=R.it,key=keyFor(k,p);
  switch(k){
    case 'type':return 'Es una proposición '+TYPE_L[p.t]+'.';
    case 'ctype':return 'Coordinación '+CT_L[key]+'.';
    case 'nexo':return (p.t==='PIS'&&p.nexo.c==='int'?'Pronombre interrogativo: «':'Nexo: «')+nexoText(it,p)+'».';
    case 'nclass':return 'Nexo '+(key==='rel'?'relacionante':'subordinante')+'.';
    case 'ante':return 'Antecedente: «'+it.k[p.nexo.a].t+'».';
    case 'nfunc':return '«'+nexoText(it,p)+'» es '+fnName(key).toLowerCase()+' dentro de la proposición.';
    case 'esp':return 'Es '+(key==='esp'?'especificativa':'explicativa')+'.';
    case 'pcls':return PCLS.find(o=>o.v===key).t+'.';
    case 'adv':return 'Adverbial '+ADV_L[key]+'.';
    case 'pfunc':return 'En la oración funciona como '+fnName(key).toLowerCase()+(p.ft?' ('+p.ft+')':'')+'.';
  }

function hintFor(k,p){
  switch(k){
    case 'type':return {coord:'Las coordinadas están al mismo nivel que otra proposición y se unen con un nexo o con un signo de puntuación; no cumplen función dentro de otra.',PIA:'Modifica a un sustantivo (el antecedente) y empieza con un relacionante como que, quien, donde, cuyo.',PIS:'Cumple función de sustantivo: se puede reemplazar por «esto» o «eso».',PIAdv:'Cumple función de adverbio: se puede reemplazar por un adverbio (allí, entonces, así, mucho) o modifica al núcleo oracional.'}[p.t];
    case 'ctype':return {cop:'Las dos ideas se suman (y, e, ni).',dis:'Las ideas se excluyen: si se da una, no se da la otra (o, u).',adv:'Hay oposición entre las dos ideas (pero, sino, sin embargo…).',exp:'La segunda proposición explica el sentido de la primera (es decir, o sea, esto es).',yux:'No hay nexo: las proposiciones se unen sólo con signos de puntuación.'}[keyFor(k,p)];

function stepOptions(st,p){

}
function questionFor(st,p){

    case 'nexo':return p.t==='PIS'&&p.nexo.c==='int'?'Tocá el pronombre interrogativo o exclamativo.':'Tocá el nexo que introduce la proposición. Si tiene más de una palabra, tocalas todas y confirmá.';
    case 'nclass':return '¿Qué clase de nexo es «'+nexoText(it,p)+'»?';
    case 'ante':return 'Tocá el antecedente de «'+nexoText(it,p)+'».';

    case 'adv':return '¿Qué clase de adverbial es?';

}
function bajada(p){
  const it=R.it,n=p.nexo;if(!n||n.a==null)return null;
  const last=it.k[n.e].t.toLowerCase();
  if(!['que','quien','quienes','cual','cuales'].includes(last))return null;
  const prefix=n.e>n.s?txt(it,n.s,n.e-1)+' ':'';

function tokCls(i){

    if(st&&st.k==='nexo'&&ps.sel.includes(i))cls.push('nx');
    if(p.nexo&&ps.nexoOk&&i>=p.nexo.s&&i<=p.nexo.e)cls.push('nxok');
    if(ps.anteOk&&p.nexo&&p.nexo.a===i)cls.push('ante');
  }

}
function renderProps(b){

  const ps0=R.ps[R.pi];const st0=ps0&&!ps0.done?ps0.steps[ps0.si]:null;
  const tapOn=st0&&(st0.k==='nexo'||st0.k==='ante')&&!ps0.reveal;
  const se=sentEl(it,spans,tokCls,tapOn?onTapStep:null);se.style.setProperty('--pc',PI_COLORS[R.pi%4]);b.append(se);
  const wrap=h('div',{class:'pcards'});

    card.append(h('div',{class:'ph'},h('b',{},'Proposición '+(k+1)),(!act&&!(ps&&ps.done))?null:null,h('span',{class:'muted',style:'flex-basis:100%;order:3;font-size:.9rem'},'«'+txt(it,p.s,p.e)+'»'),
      (!act&&!(ps&&ps.done))?h('button',{class:'tbtn',onclick:()=>{activate(k);R.pi=k;rerender();}},'Analizar'):null));
    if(ps&&ps.sum.length)card.append(h('ul',{class:'sum'},ps.sum.map(s=>h('li',{},s))));
    if(act&&ps&&!ps.done)card.append(stepUI(p,ps));

}
function stepUI(p,ps){
  const it=R.it,st=ps.steps[ps.si];const box=h('div',{});
  box.append(h('div',{class:'dots','aria-hidden':'true'},ps.steps.map((s,i)=>h('i',{class:i<=ps.si?'on':''}))));
  box.append(h('p',{class:'q'},questionFor(st,p)));
  if(st.k==='nfunc'){const bj=bajada(p);if(bj)box.append(h('p',{class:'help'},'Probá bajar la proposición con el antecedente en lugar del nexo: «'+bj+'».'));}

    box.append(fb('info','La respuesta es: '+ans,hintFor(st.k,p)));
    box.append(h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn','data-act':'next',onclick:()=>{ps.sum.push(sumLine(st.k,p));if(st.k==='nexo')ps.nexoOk=true;if(st.k==='ante')ps.anteOk=true;advance(p,ps);}},'Entendido, seguir')));
    return box;
  }

    box.append(h('div',{class:'row',style:'margin-top:6px'},h('button',{class:'btn','data-act':'confirm',disabled:!ps.sel.length,onclick:()=>confirmNexo(p,ps)},'Es este nexo'),ps.sel.length?h('button',{class:'btn alt',onclick:()=>{ps.sel=[];rerender();}},'Borrar selección'):null));

    opts.forEach(o=>{
      if(o.g&&o.g!==lastG){grid.append(h('div',{class:'grpl'},o.g));lastG=o.g;}
      const wrongs=ps.w[st.k]||[];
      grid.append(h('button',{class:'opt'+(wrongs.includes(o.v)?' bad':''),'data-v':o.v,disabled:wrongs.includes(o.v),onclick:()=>pick(p,ps,st,o.v)},o.t,o.d?h('small',{},o.d):null));

function onTapStep(i){
  const p=R.it.props[R.pi],ps=R.ps[R.pi],st=ps.steps[ps.si];
  if(!R.it.k[i].w)return;
  if(st.k==='nexo'){const j=ps.sel.indexOf(i);if(j>=0)ps.sel.splice(j,1);else ps.sel.push(i);ps.msg=null;rerender();}
  else if(st.k==='ante'){
    if(i===p.nexo.a){ps.anteOk=true;ps.sum.push(sumLine('ante',p));advance(p,ps);}
    else miss(p,ps,'ante','«'+R.it.k[i].t+'» no es el antecedente. '+hintFor('ante',p));
  }
}
function confirmNexo(p,ps){
  const n=p.nexo;const want=[];for(let i=n.s;i<=n.e;i++)want.push(i);
  const got=ps.sel.slice().sort((a,b)=>a-b);
  if(want.length===got.length&&want.every((x,i)=>x===got[i])){ps.nexoOk=true;ps.sum.push(sumLine('nexo',p));ps.sel=[];advance(p,ps);}
  else{ps.sel=[];miss(p,ps,'nexo','Esa selección no es el nexo. '+hintFor('nexo',p));}
}
function miss(p,ps,k,text){
  R.errs++;ps.w[k]=(ps.w[k]||[]).concat(['x']);
  if(ps.w[k].length>=3){ps.reveal=true;ps.msg=null;}
  else ps.msg=fb('bad','No es así',text);
  rerender();
}
function pick(p,ps,st,v){
  const key=keyFor(st.k,p);
  if(alts(key).includes(v)){
    ps.sum.push(sumLine(st.k,p));
    if(st.k==='type')ps.typed=true;
    advance(p,ps);
  } else {
    R.errs++;ps.w[st.k]=(ps.w[st.k]||[]).concat([v]);
    if(ps.w[st.k].length>=3){ps.reveal=true;ps.msg=null;}
    else ps.msg=fb('bad','No es '+labelOf(st.k,p,v).toLowerCase(),hintFor(st.k,p));
    rerender();
  }
}
function advance(p,ps){
  if(ps.reveal){R.helped=true;}
  ps.reveal=false;ps.msg=null;ps.si++;
  if(ps.steps[ps.si-1].k==='type')ps.typed=true;
  if(ps.si>=ps.steps.length){
    ps.done=true;
    const nxt=R.it.props.findIndex((q2,k)=>!(R.ps[k]&&R.ps[k].done));
    if(nxt>=0){activate(nxt);}
    else{ if(R.it.prons&&R.it.prons.length){R.stage='pron';initPron();}else finish(); }
  }

/* --- pronombres --- */
function initPron(){R.pr={i:0,node:'N0',w:{},msg:null,reveal:false,cur:true,sum:[]};}
function renderPron(b){
  const it=R.it,pr=R.pr,list=it.prons;

    box.append(h('div',{class:'row',style:'margin-top:10px'},h('button',{class:'btn','data-act':'next',onclick:()=>{R.helped=true;pr.reveal=false;treeGo(right.v,code);}},'Entendido, seguir')));
  } else {
    const grid=h('div',{class:'opts'});
    nd.o.forEach(o=>{const wr=(pr.w[pr.node]||[]).includes(o.v);grid.append(h('button',{class:'opt'+(wr?' bad':''),'data-v':o.v,disabled:wr,onclick:()=>treePick(o.v,code)},o.t,o.d?h('small',{},o.d):null));});

function okAt(node,v,codes){return codes.some(c=>PATHS[c].some(([n,x])=>n===node&&x===v));}
function treePick(v,code){
  const pr=R.pr;
  if(okAt(pr.node,v,code)){treeGo(v,code);}
  else{R.errs++;pr.w[pr.node]=(pr.w[pr.node]||[]).concat([v]);
    if(pr.w[pr.node].length>=2&&TREE[pr.node].o.length>2||pr.w[pr.node].length>=3){pr.reveal=true;pr.msg=null;}
    else if(TREE[pr.node].o.length===2&&pr.w[pr.node].length>=1){pr.reveal=false;pr.msg=fb('bad','Probá con la otra opción',TREE_HINT[pr.node](code[0]));}

}
function treeGo(v,code){
  const pr=R.pr,nd=TREE[pr.node];
  if(nd.code&&nd.code[v]){
    const leaf=nd.code[v];
    const it=R.it,pn=it.prons[pr.i];
    pr.sum.push('«'+txt(it,pn.s,pn.e)+'»: '+LEAF[leaf]+'.');
    pr.i++;pr.node='N0';pr.w={};pr.msg=null;
    if(pr.i>=it.prons.length){pr.cur=false;finish();return;}
    rerender();return;

/* --- analisis de funciones (repaso) --- */
function renderFunc(b){

    b.append(grid,h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn alt',onclick:()=>{R.pending=null;rerender();}},'Cancelar')));
  } else if(R.first!=null)b.append(h('p',{class:'help'},'Empieza en «'+it.k[R.first].t+'». Tocá donde termina.'));

function onTapFunc(i){
  if(R.pending)return;
  if(R.first==null)R.first=i;

    if(R.marks.some(m=>m.s===s&&m.e===e)){R.msg=fb('info','','Ese tramo ya está marcado.');}

}
function checkFunc(){
  const it=R.it;R.checks++;const parts=[];let wrong=0;
  R.marks.forEach(m=>{ if(m.ok)return;

    else if(k){wrong++;m.bad='fn';parts.push(h('div',{},'«'+txt(it,m.s,m.e)+'»: la extensión está bien, pero no es '+FN[m.fn].toLowerCase()+'. '+(FN_HINT[alts(k.fn)[0]]||'')));}
    else{wrong++;m.bad='span';parts.push(h('div',{},'«'+txt(it,m.s,m.e)+'» no coincide con ningún constituyente de la oración. Revisá dónde empieza y dónde termina.'));}
  });

  if(!wrong&&!missing){R.marks.sort((a,b)=>a.s-b.s);finish();return;}
  R.errs+=wrong||1;

  parts.push(h('div',{class:'muted'},'Las marcas incorrectas se quitaron; las correctas quedaron en verde.'));
  R.marks=R.marks.filter(m=>m.ok);
  R.msg=fb('bad','Todavía no',parts);rerender();
}

/* --- ronda rápida: preguntas generadas con los análisis del banco --- */
let Q=null;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuf(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sentTxt(it){return txt(it,0,it.k.length-1);}
const TYPE_OF={pis:'PIS',pia:'PIA',adv:'PIAdv',coo:'coord'};
const NEXO_RE=/^(que|qué|si|como|cómo|cuando|cuándo|donde|dónde|adonde|quien|quién|quienes|quiénes|cual|cuales|cuyo|cuya|cuyos|cuyas|aunque|porque|pues|mientras|pero|y|o|ni|sino|cuanto|apenas)$/i;
const SE_G={OD:['OI','REF_OD','REC_OD'],OI:['OD','REF_OI','REC_OI'],REF_OD:['REF_OI','REC_OD','OD'],REF_OI:['REF_OD','REC_OI','OI'],REC_OD:['REC_OI','REF_OD','OD'],REC_OI:['REC_OD','REF_OI','OI'],SCR:['REF_OD','PAS','IMP'],PAS:['IMP','SCR','OI'],IMP:['PAS','SCR','OD']};

function genCands(u){

  const C={tipo:[],vf:[],nexo:[],ante:[],esp:[],nfun:[],pf:[],pcls:[],advs:[],ctype:[],cuenta:[],comp:[],se:[],fn:[]};
  pool.forEach(it=>{
    (it.props||[]).forEach(p=>{
      if(u!=='all'&&p.t!==TYPE_OF[u])return;
      const n=p.nexo;
      if(u==='all')C.tipo.push({it,p});
      if(n&&nexoLike(it))C.nexo.push({it,p});
      if(p.t==='PIA'){C.esp.push({it,p});C.vf.push({it,p});if(n&&n.a!=null&&it.k[n.a])C.ante.push({it,p});if(n&&n.nf)C.nfun.push({it,p});}
      if(p.t==='PIS'){C.pf.push({it,p});C.vf.push({it,p});C.pcls.push({it,p});if(n&&(n.c==='rel'||n.c==='int')&&n.nf)C.nfun.push({it,p});}
      if(p.t==='PIAdv'){C.advs.push({it,p});C.vf.push({it,p});}
      if(p.t==='coord'&&propCt(p)){C.ctype.push({it,p});C.vf.push({it,p});}
    });
    if(it.u==='coo'&&it.props&&it.props.length>=2&&(u==='coo'||u==='all'))C.cuenta.push({it});
    if(it.u==='coo'&&(u==='coo'||u==='all')&&(it.m==='simple'||(it.props||[]).length>=2))C.comp.push({it});
    (it.prons||[]).forEach(pn=>{if(String(pn.p).indexOf('/')<0)C.se.push({it,pn});});
    if(it.m==='func')(it.spans||[]).forEach(sp=>{if(String(sp.fn).indexOf('/')<0)C.fn.push({it,sp});});

}
function optsFrom(goods,pool,label,rnd,total){
  const dis=sample(pool.filter(x=>!goods.includes(x)),Math.max(0,(total||4)-goods.length),rnd);
  return shuf(goods.concat(dis),rnd).map(v=>({t:label(v),ok:goods.includes(v)}));
}
function buildQ(kind,c,rnd){

  if(kind==='tipo')return optQ('¿Qué tipo de proposición es '+P+'?',shuf(TYPES,rnd).map(t=>({t:t.t,ok:t.v===p.t})),E);

  if(kind==='pcls'){const v=p.sub==='dd'?'dd':n.c;return optQ('Clasificá '+P+' según su nexo.',shuf(PCLS,rnd).map(o=>({t:o.t,ok:o.v===v})),E);}

  if(kind==='ctype'){const v=propCt(p);return optQ('¿Cómo está unida '+P+' con la proposición anterior?',optsFrom([v],CT.map(x=>x.v),x=>CT.find(y=>y.v===x).t,rnd),E);}
  if(kind==='cuenta'){const m=it.props.length;const os=[m-1,m,m+1,m+2].filter(x=>x>=1).slice(0,4);return optQ('¿Cuántas proposiciones coordinadas tiene la oración?',shuf(os,rnd).map(x=>({t:String(x),ok:x===m})),'Son '+m+': '+it.props.map(q=>'«'+txt(it,q.s,q.e)+'»').join('; ')+'.');}

    const e=simple?(it.n||'Un solo sujeto para los dos verbos: oración simple bimembre con predicado compuesto.'):('Cada verbo tiene su propio sujeto: son '+it.props.length+' proposiciones coordinadas.'+(it.n?' '+it.n:''));
    return optQ('¿Cómo se clasifica esta oración?',shuf([{t:'Oración compuesta por coordinación',ok:!simple},{t:'Oración simple bimembre con predicado compuesto',ok:simple},{t:'Oración compuesta por subordinación',ok:false}],rnd),e);}
  if(kind==='vf'){
    const truth=rnd()<0.5;let claim,real;
    if(p.t==='PIA'){const w=truth?p.sub:(p.sub==='esp'?'exp':'esp');claim=P+' es una proposición adjetiva '+(w==='esp'?'especificativa':'explicativa')+'.';}
    else if(p.t==='PIS'){const g=alts(p.f)[0];const w=truth?g:sample(PF_PIS.filter(x=>!alts(p.f).includes(x)),1,rnd)[0];claim=P+' cumple la función de '+fnName(w).toLowerCase()+'.';}
    else if(p.t==='PIAdv'){const w=truth?p.sub:sample(ADV.map(x=>x.v).filter(x=>x!==p.sub),1,rnd)[0];claim=P+' es una proposición adverbial '+ADV_L[w]+'.';}
    else{const v=propCt(p);const w=truth?v:sample(CT.map(x=>x.v).filter(x=>x!==v),1,rnd)[0];claim=P+' está unida con la anterior por coordinación '+CT_L[w]+'.';}
    return optQ('¿Verdadero o falso? '+claim,[{t:'Verdadero',ok:truth},{t:'Falso',ok:!truth}],(truth?'Es verdadero. ':'Es falso. ')+E);}
  if(kind==='nexo'){const a=[];for(let i=n.s;i<=n.e;i++)a.push(i);return {k:'tap',it,kind,mark:[],q:'Tocá el nexo que introduce '+P+'.',ans:a,e:E};}
  if(kind==='ante'){return {k:'tap',it,kind,mark:[n.s],q:'Tocá el antecedente de «'+txt(it,n.s,n.e)+'» (resaltado).',ans:[n.a],e:'«'+txt(it,n.s,n.e)+'» reemplaza a «'+it.k[n.a].t+'», que es su antecedente.'};}
  if(kind==='se'){const pn=c.pn,g=alts(pn.p)[0];return optQ('¿Qué es «'+txt(it,pn.s,pn.e)+'» en esta oración?',shuf([g].concat(SE_G[g]),rnd).map(v=>({t:LEAF[v],ok:v===g})),LEAF[g]+'.'+(it.n?' '+it.n:''));}
  if(kind==='fn'){const sp=c.sp,g=alts(sp.fn)[0];const grp=FN_CORE.includes(g)?FN_CORE:FN_CIRC;const other=FN_CORE.includes(g)?FN_CIRC:FN_CORE;
    const ds=sample(grp.filter(x=>x!==g),2,rnd).concat(sample(other,1,rnd));
    return optQ('¿Qué función cumple «'+txt(it,sp.s,sp.e)+'»?',shuf([g].concat(ds),rnd).map(v=>({t:FN[v],ok:v===g})),FN_HINT[g]||'');}
}
function genRound(u,seed,n){
  const rnd=mulberry(seed),C=genCands(u);
  const kinds=shuf(Object.keys(C).filter(k=>C[k].length),rnd);
  Object.keys(C).forEach(k=>C[k]=shuf(C[k],rnd));
  const qs=[];
  [true,false].forEach(strict=>{
    let alive=kinds.slice(),i=0,guard=0;
    while(qs.length<n&&alive.length&&guard++<400){
      const k=alive[i%alive.length];
      const idx=C[k].findIndex(x=>!qs.some(q=>q.it===x.it&&(strict||q.kind===k)));
      if(idx<0){alive.splice(alive.indexOf(k),1);continue;}
      const c=C[k].splice(idx,1)[0];qs.push(buildQ(k,c,rnd));i++;
    }
  });
  return shuf(qs,rnd);
}
function startRound(u,seed){
  const s=seed||Math.floor(Math.random()*1e9)+1;
  const qs=genRound(u,s,8);
  if(!qs.length)return;
  Q={u,seed:s,qs,i:0,errs:0,good:0,wrongs:[],tapWrong:[],solved:false,reveal:false,miss:false,done:false};
  R=null;
  if(u!=='all'){store.tab=u;store.view='practica';}else store.tab='inicio';
  save();render();window.scrollTo(0,0);
}
